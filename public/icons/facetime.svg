<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="facetimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5"/>
      <stop offset="50%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#facetimeGrad)" opacity="0.95"/>
  
  <!-- Video camera icon -->
  <g transform="translate(20, 28)">
    <!-- Camera body -->
    <rect x="0" y="5" width="35" height="30" rx="4" fill="white" opacity="0.95"/>
    
    <!-- Camera lens/arrow -->
    <path d="M40 10L55 0V40L40 30V10Z" fill="white" opacity="0.95"/>
  </g>
  
  <!-- Shine effect -->
  <ellipse cx="38" cy="35" rx="15" ry="10" fill="white" opacity="0.25" transform="rotate(-30 38 35)"/>
</svg>