services:
  openwa:
    build:
      context: https://github.com/rmyndharis/OpenWA.git#main
      dockerfile: Dockerfile
    container_name: smarty-openwa
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${OPENWA_PORT:-2785}:2785"
    environment:
      NODE_ENV: production
      PORT: 2785
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      API_MASTER_KEY: ${OPENWA_API_KEY:?OPENWA_API_KEY must be at least 32 characters}
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER:?OPENWA_API_KEY_PEPPER is required}
      ENGINE_TYPE: baileys
      AUTO_START_SESSIONS: "true"
      SESSION_DATA_PATH: /app/data/sessions
      DATABASE_TYPE: sqlite
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/storage
      SSRF_ALLOWED_HOSTS: host.docker.internal
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
    volumes:
      - openwa-data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 2048
    mem_limit: 2g

volumes:
  openwa-data: