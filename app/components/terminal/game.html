<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Devil Level — Troll Platformer (Demo)</title>
    <style>
        :root {
            --bg1: #050306;
            --bg2: #0c0405;
            --accent: #ff3b3b;
            --muted: #9b9b9b;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: linear-gradient(180deg, var(--bg1), var(--bg2));
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            color: #eee
        }

        #wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            gap: 8px
        }

        canvas {
            background: #070507;
            border-radius: 12px;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.7);
            max-width: 100%
        }

        .hud {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 1000px;
            align-items: center
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 10px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer
        }

        .mobile-controls {
            display: none;
            margin-top: 8px;
            gap: 8px
        }

        @media (max-width:720px) {
            .mobile-controls {
                display: flex
            }
        }

        .overlay {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, rgba(10, 8, 12, 0.96), rgba(12, 6, 8, 0.96));
            padding: 16px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
            min-width: 260px;
            z-index: 999
        }

        .title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 6px
        }

        .small {
            font-size: 13px;
            color: var(--muted)
        }

        /* simple onscreen button look */
        .btn-touch {
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06)
        }
    </style>
</head>

<body>
    <div id="wrap">
        <div class="hud" style="max-width:1000px;">
            <div id="score">Score: 0</div>
            <div id="level" class="small">Level: 1</div>
            <div style="flex:1"></div>
            <button id="mute" class="btn">Mute</button>
            <button id="restart" class="btn" autofocus tabindex="0">Restart</button>
        </div>
        <canvas id="game" width="1100" height="620"></canvas>
        <div class="mobile-controls">
            <button id="leftTouch" class="btn-touch">◀</button>
            <button id="jumpTouch" class="btn-touch">Jump</button>
            <button id="rightTouch" class="btn-touch">▶</button>
        </div>
    </div>

    <div id="overlay" class="overlay" style="display:none">
        <div class="title" id="overlayTitle">You Died</div>
        <div id="overlayText" class="small">Devil got you.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
            <button id="overlayRestart" class="btn">Restart</button>
            <button id="overlayClose" class="btn">Close</button>
        </div>
    </div>

    <script>
        /*
        Devil Level — Full single-file troll platformer
        Features
        - Triangular spikes = instant death
        - Lava kill
        - Falling walls, collapsing platforms, hidden spikes (random pop-ups)
        - Enemies with pause-and-dash behavior (troll AI)
        - Portal win
        - Difficulty scaling per restart
        - Particles & simple audio (WebAudio)
        - Mobile and desktop controls
        */

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W = canvas.width, H = canvas.height;

        function resize() {
            const vw = Math.min(window.innerWidth - 24, 1200);
            const vh = Math.min(window.innerHeight - 160, 800);
            const ratio = 16 / 9;
            let w = vw, h = Math.round(w / ratio);
            if (h > vh) { h = vh; w = Math.round(h * ratio); }
            canvas.width = w; canvas.height = h; W = w; H = h;
        }
        window.addEventListener('resize', resize); resize();

        // input
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        document.getElementById('leftTouch').addEventListener('touchstart', e => { keys['arrowleft'] = true }); document.getElementById('leftTouch').addEventListener('touchend', e => { keys['arrowleft'] = false });
        document.getElementById('rightTouch').addEventListener('touchstart', e => { keys['arrowright'] = true }); document.getElementById('rightTouch').addEventListener('touchend', e => { keys['arrowright'] = false });
        document.getElementById('jumpTouch').addEventListener('touchstart', e => { keys[' '] = true }); document.getElementById('jumpTouch').addEventListener('touchend', e => { keys[' '] = false });

        // audio: small WebAudio helper + looped dark synth
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let muted = false;
        function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

        // SFX helper
        function sfxTone(freq, type = 'sine', dur = 0.12, vol = 0.08) {
            if (muted) return;
            ensureAudio();
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.value = vol;
            o.connect(g); g.connect(audioCtx.destination);
            o.start();
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            o.stop(audioCtx.currentTime + dur + 0.02);
        }

        // a simple looped dark synth (tiny)
        let synthLoopTimer = null;
        function startSynthLoop() {
            if (muted) return;
            ensureAudio();
            if (synthLoopTimer) clearInterval(synthLoopTimer);
            // schedule small pulsing bass hits and ambient oscillator
            synthLoopTimer = setInterval(() => {
                const now = audioCtx.currentTime;
                // bass hit
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = 'sawtooth'; o.frequency.value = 80 + Math.random() * 6;
                g.gain.value = 0.07;
                o.connect(g); g.connect(audioCtx.destination);
                o.start(now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3); o.stop(now + 0.35);
                // ambient drone (short)
                const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
                o2.type = 'sine'; o2.frequency.value = 220 + Math.random() * 20;
                g2.gain.value = 0.02;
                o2.connect(g2); g2.connect(audioCtx.destination);
                o2.start(now); g2.gain.exponentialRampToValueAtTime(0.001, now + 1.1); o2.stop(now + 1.2);
            }, 900);
        }
        function stopSynthLoop() { if (synthLoopTimer) clearInterval(synthLoopTimer); synthLoopTimer = null; }

        // particle system
        const particles = [];
        function emit(x, y, dx, dy, color, life = 0.9, size = 3) { particles.push({ x, y, dx, dy, color, life, age: 0, size }) }
        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx * dt; p.y += p.dy * dt + 40 * dt; p.age += dt;
                if (p.age > p.life) particles.splice(i, 1);
            }
        }
        function drawParticles(ctx) {
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - p.age / p.life), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // utilities
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y }

        // point-in-triangle (for triangular spike collision)
        function pointInTri(px, py, ax, ay, bx, by, cx, cy) {
            const v0x = cx - ax, v0y = cy - ay;
            const v1x = bx - ax, v1y = by - ay;
            const v2x = px - ax, v2y = py - ay;
            const dot00 = v0x * v0x + v0y * v0y;
            const dot01 = v0x * v1x + v0y * v1y;
            const dot02 = v0x * v2x + v0y * v2y;
            const dot11 = v1x * v1x + v1y * v1y;
            const dot12 = v1x * v2x + v1y * v2y;
            const invDenom = 1 / (dot00 * dot11 - dot01 * dot01 + 1e-9);
            const u = (dot11 * dot02 - dot01 * dot12) * invDenom;
            const v = (dot00 * dot12 - dot01 * dot02) * invDenom;
            return (u >= 0) && (v >= 0) && (u + v < 1);
        }

        // ----------------------------------
        // Game objects and logic
        // ----------------------------------

        let difficulty = 1; // scales with restart
        let levelNum = 1;

        class Player {
            constructor(x, y) {
                this.x = x; this.y = y; this.w = 28; this.h = 44;
                this.vx = 0; this.vy = 0; this.onGround = false; this.facing = 1;
                this.score = 0; this.dead = false;
            }
            get bounds() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
            update(dt, level) {
                if (this.dead) return;
                const speed = 220 + difficulty * 30;
                const jump = 430 + difficulty * 20;
                const gravity = 1200;
                let left = keys['arrowleft'] || keys['a'];
                let right = keys['arrowright'] || keys['d'];
                let up = keys[' '] | keys['w'] || keys['arrowup'];

                if (left) { this.vx = -speed; this.facing = -1; }
                else if (right) { this.vx = speed; this.facing = 1; }
                else this.vx = 0;

                if ((keys[' '] || keys['w'] || keys['arrowup']) && this.onGround) {
                    this.vy = -jump;
                    this.onGround = false;
                    sfxTone(560, 'square', 0.12, 0.08);
                    for (let i = 0; i < 8; i++) emit(this.x + this.w / 2, this.y + this.h, (Math.random() - 0.5) * 120, -200 - Math.random() * 160, 'rgba(255,140,80,0.95)', 0.6, 3);
                }

                this.vy += gravity * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // platform collision - AABB
                this.onGround = false;
                for (const p of level.platforms) {
                    if (rectsOverlap(this.bounds, p)) {
                        const prevY = this.y - this.vy * dt;
                        if (prevY + this.h <= p.y + 8 && this.vy >= 0) {
                            this.y = p.y - this.h; this.vy = 0; this.onGround = true;
                            if (p.onStep) p.onStep(); // trigger collapse platforms
                        } else {
                            // horizontal push
                            if (this.x < p.x) this.x = p.x - this.w - 0.1;
                            else this.x = p.x + p.w + 0.1;
                            this.vx = 0;
                        }
                    }
                }

                // world bounds
                if (this.x < -200) this.x = -200;
                if (this.x > level.width + 200) this.x = level.width + 200;
                if (this.y > level.height + 300) { this.die('Fell too deep'); }
            }
            die(reason) {
                if (this.dead) return;
                this.dead = true;
                stopSynthLoop();
                sfxTone(80, 'sawtooth', 0.5, 0.12);
                for (let i = 0; i < 28; i++) emit(this.x + this.w / 2, this.y + this.h / 2, (Math.random() - 0.5) * 380, (Math.random() - 0.5) * 380, 'rgba(220,30,30,0.95)', 1.2, 3);
                overlayShow('You Died', reason || 'The devil tricked you.');
            }
            revive(x, y) {
                this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.dead = false; this.score = 0;
                startSynthLoop();
            }
            draw(ctx, cam) {
                const x = this.x - cam.x, y = this.y - cam.y;
                // shadow
                ctx.fillStyle = 'rgba(0,0,0,0.28)';
                ctx.beginPath(); ctx.ellipse(x + this.w / 2, y + this.h + 8, this.w * 0.7, 9, 0, 0, Math.PI * 2); ctx.fill();
                ctx.save();
                if (this.dead) ctx.globalAlpha = 0.4;
                // body
                ctx.fillStyle = '#ffd6d6'; ctx.fillRect(x, y, this.w, this.h);
                // face / eyes
                ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x + 6, y + 8, 10, 10);
                ctx.restore();
            }
        }

        class FallingWall {
            constructor(x, y, w, h, delayActive = false) {
                this.x = x; this.y = y; this.w = w; this.h = h;
                this.falling = false; this.vy = 0; this.activated = false; this.fallSpeed = 220 + Math.random() * 180 + difficulty * 40;
                this.triggerDist = 150 + Math.random() * 100;
                this.delay = delayActive ? 0.35 + Math.random() * 0.8 : 0;
                this.dropTimer = 0;
            }
            update(dt, player) {
                if (!this.activated) {
                    if (Math.abs(player.x - this.x) < this.triggerDist) {
                        this.activated = true;
                        this.dropTimer = this.delay;
                    }
                } else if (!this.falling) {
                    if (this.dropTimer > 0) { this.dropTimer -= dt; }
                    else { this.falling = true; }
                }
                if (this.falling) {
                    this.vy += 800 * dt; // accelerate
                    this.y += this.vy * dt + this.fallSpeed * dt;
                    // collision with player
                    if (rectsOverlap({ x: this.x, y: this.y, w: this.w, h: this.h }, player.bounds)) {
                        player.die('Crushed by a falling wall');
                    }
                }
            }
            draw(ctx, cam) {
                ctx.fillStyle = '#662b2b';
                ctx.fillRect(this.x - cam.x, this.y - cam.y, this.w, this.h);
                // glowing devil cracks
                ctx.strokeStyle = 'rgba(255,60,60,0.08)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < 3; i++) {
                    ctx.moveTo(this.x - cam.x + 5, this.y - cam.y + 10 + i * 12);
                    ctx.lineTo(this.x - cam.x + this.w - 6, this.y - cam.y + 6 + i * 14 + Math.sin(Date.now() / 200 + i));
                }
                ctx.stroke();
            }
        }

        class CollapsingPlatform {
            constructor(x, y, w, h) {
                this.x = x; this.y = y; this.w = w; this.h = h;
                this.collapsed = false; this.timer = null; this.timeToCollapse = 0.35 + Math.random() * 0.9 - difficulty * 0.05;
            }
            onStep() {
                if (this.timer === null && !this.collapsed) {
                    this.timer = this.timeToCollapse;
                }
            }
            update(dt, player) {
                if (this.timer !== null) {
                    this.timer -= dt;
                    if (this.timer <= 0 && !this.collapsed) {
                        this.collapsed = true;
                        // animation: spawn small pieces
                        for (let i = 0; i < 10; i++) emit(this.x + Math.random() * this.w, this.y + Math.random() * this.h, (Math.random() - 0.5) * 200, -Math.random() * 160, 'rgba(180,100,80,0.95)', 0.9, 3);
                    }
                }
                // if collapsed, sink down slowly
                if (this.collapsed) this.y += 380 * dt;
                // check kill
                if (this.collapsed && rectsOverlap({ x: this.x, y: this.y, w: this.w, h: this.h }, player.bounds)) {
                    player.die('Platform collapsed');
                }
            }
            draw(ctx, cam) {
                if (this.collapsed) ctx.globalAlpha = 0.6;
                ctx.fillStyle = '#262626';
                ctx.fillRect(this.x - cam.x, this.y - cam.y, this.w, this.h);
                // crack lines
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.beginPath();
                for (let i = 0; i < this.w; i += 20) {
                    ctx.moveTo(this.x - cam.x + i, this.y - cam.y + 3);
                    ctx.lineTo(this.x - cam.x + i + Math.sin((i + Date.now() / 60) / 30) * 6, this.y - cam.y + this.h - 4);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        class HiddenSpike {
            constructor(x, y, size, delayPop = false) {
                this.x = x; this.y = y; this.size = size;
                this.active = false; this.timer = 0; this.popInterval = 3 + Math.random() * 3 - difficulty * 0.15;
                this.delayPop = delayPop;
                this.initialDelay = Math.random() * 1.4;
                this.riseSpeed = 240 + Math.random() * 120 + difficulty * 40;
                this.origY = y + size; // hidden below ground
                this.y = this.origY;
            }
            update(dt, player) {
                if (this.delayPop) {
                    if (this.initialDelay > 0) this.initialDelay -= dt;
                    else this.delayPop = false;
                } else {
                    this.timer += dt;
                    if (this.timer > this.popInterval) {
                        this.timer = 0;
                        this.active = true;
                        // rise quickly a bit then retract
                        this.y = this.origY;
                    }
                }
                if (this.active) {
                    this.y -= this.riseSpeed * dt;
                    if (this.y < this.origY - this.size) {
                        // stay out briefly then retract
                        this.active = false;
                        this.y = this.origY - this.size;
                    }
                } else {
                    // retract slowly
                    if (this.y < this.origY) this.y += this.riseSpeed * 0.6 * dt;
                    if (this.y > this.origY) this.y = this.origY;
                }
                // collision — check triangle tip area
                // build triangle coordinates (pointing up)
                const tipX = this.x + this.size / 2, tipY = this.y;
                const aX = tipX, aY = tipY;
                const bX = this.x, bY = this.y + this.size;
                const cX = this.x + this.size, cY = this.y + this.size;
                // sample bottom points of player to detect foot overlap
                const p = player;
                const footPoints = [
                    { x: p.x + 4, y: p.y + p.h - 2 },
                    { x: p.x + p.w - 4, y: p.y + p.h - 2 },
                    { x: p.x + p.w / 2, y: p.y + p.h - 2 }
                ];
                for (const pt of footPoints) {
                    if (pointInTri(pt.x, pt.y, aX, aY, bX, bY, cX, cY)) {
                        player.die('Hidden spike!');
                    }
                }
            }
            draw(ctx, cam) {
                // triangle from this.y -> this.y+size
                ctx.fillStyle = 'rgba(255,60,60,0.95)';
                ctx.beginPath();
                ctx.moveTo(this.x - cam.x + this.size / 2, this.y - cam.y);
                ctx.lineTo(this.x - cam.x, this.y - cam.y + this.size);
                ctx.lineTo(this.x - cam.x + this.size, this.y - cam.y + this.size);
                ctx.closePath();
                ctx.fill();
                // small shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(this.x - cam.x, this.y - cam.y + this.size, this.size, 4);
            }
        }

        // Enemy with pause and dash
        class Enemy {
            constructor(x, y, range = 120) {
                this.x = x; this.y = y; this.w = 34; this.h = 28; this.vx = 40; this.vy = 0; this.baseX = x; this.range = range;
                this.state = 'patrol'; // patrol, pause, dash
                this.stateTimer = 0;
                this.direction = 1;
            }
            update(dt, player, level) {
                // simple gravity
                this.vy += 1100 * dt; this.y += this.vy * dt;
                // ground collision
                for (const p of level.platforms) {
                    if (rectsOverlap(this.bounds, p)) {
                        const prevY = this.y - this.vy * dt;
                        if (prevY + this.h <= p.y + 8) { this.y = p.y - this.h; this.vy = 0; }
                    }
                }
                // state machine
                const dist = player.x - this.x;
                if (Math.abs(dist) < 260) {
                    // when player near, 50% chance to go into troll behaviour
                    if (this.state === 'patrol' && Math.random() < 0.008 + 0.002 * difficulty) {
                        this.state = 'pause'; this.stateTimer = 0.18 + Math.random() * 0.6;
                    }
                }
                if (this.state === 'patrol') {
                    // patrol within base range
                    if (this.x < this.baseX - this.range) this.direction = 1;
                    if (this.x > this.baseX + this.range) this.direction = -1;
                    this.vx = 60 * this.direction;
                    this.x += this.vx * dt;
                } else if (this.state === 'pause') {
                    this.stateTimer -= dt;
                    if (this.stateTimer <= 0) {
                        this.state = 'dash';
                        this.stateTimer = 0.25 + Math.random() * 0.6;
                        // dash towards player
                        const dir = (player.x > this.x) ? 1 : -1;
                        this.vx = (220 + Math.random() * 80 + difficulty * 40) * dir;
                    }
                } else if (this.state === 'dash') {
                    this.x += this.vx * dt;
                    this.stateTimer -= dt;
                    if (this.stateTimer <= 0) { this.state = 'patrol'; }
                }
                // collision with player -> kill or be stomped
                if (rectsOverlap(this.bounds, player.bounds)) {
                    if (player.vy > 80) { // stomp
                        this.x = -9999; player.vy = -260; player.score += 20; sfxTone(880, 'square', 0.08, 0.07);
                    } else {
                        player.die('Eaten by demon');
                    }
                }
            }
            get bounds() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
            draw(ctx, cam) {
                ctx.fillStyle = '#ff8a8a';
                ctx.fillRect(this.x - cam.x, this.y - cam.y, this.w, this.h);
                ctx.fillStyle = '#2b2b2b'; ctx.fillRect(this.x - cam.x + 6, this.y - cam.y + 4, 8, 8);
            }
        }

        // Portal
        class Portal {
            constructor(x, y) {
                this.x = x; this.y = y; this.w = 52; this.h = 76;
                this.t = Math.random() * 1000;
            }
            update(dt) {
                this.t += dt;
            }
            draw(ctx, cam) {
                const x = this.x - cam.x, y = this.y - cam.y;
                const t = Date.now() / 300;
                // glow
                ctx.beginPath(); ctx.ellipse(x + this.w / 2, y + this.h / 2 + 6, this.w * 1.4 + Math.sin(t) * 6, this.h * 1.7 + Math.cos(t) * 6, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,30,30,0.06)'; ctx.fill();
                // portal body
                const grad = ctx.createLinearGradient(x, y, x + this.w, y + this.h);
                grad.addColorStop(0, 'rgba(255,60,60,0.9)'); grad.addColorStop(1, 'rgba(255,160,120,0.6)');
                ctx.fillStyle = grad; ctx.fillRect(x, y, this.w, this.h);
                // swirl
                ctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < 6; i++) {
                    ctx.beginPath();
                    ctx.ellipse(x + this.w / 2 + Math.sin(t + i) * 6, y + this.h / 2 + Math.cos(t + i) * 6, this.w * 0.35, this.h * 0.45, 0, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,120,120,0.09)'; ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
            }
            collides(player) {
                return rectsOverlap({ x: this.x, y: this.y, w: this.w, h: this.h }, player.bounds);
            }
        }

        // Level builder
        function buildLevel() {
            const width = 2800, height = 1600;
            const platforms = [];
            // ground
            platforms.push({ x: 0, y: height - 60, w: width, h: 60, onStep: null });
            // stairs and platforms
            platforms.push({ x: 160, y: height - 170, w: 200, h: 20, onStep: null });
            platforms.push({ x: 420, y: height - 260, w: 160, h: 20, onStep: null });
            platforms.push({ x: 620, y: height - 350, w: 120, h: 20, onStep: null });
            platforms.push({ x: 820, y: height - 300, w: 240, h: 20, onStep: null });
            platforms.push({ x: 1110, y: height - 430, w: 240, h: 20, onStep: null });
            platforms.push({ x: 1460, y: height - 320, w: 160, h: 20, onStep: null });
            platforms.push({ x: 1740, y: height - 370, w: 360, h: 20, onStep: null });
            // some collapsing ones
            const collapsingPlatforms = [
                new CollapsingPlatform(540, height - 320, 120, 20),
                new CollapsingPlatform(1320, height - 420, 140, 20),
                new CollapsingPlatform(2000, height - 330, 120, 20)
            ];
            for (const c of collapsingPlatforms) {
                platforms.push({ x: c.x, y: c.y, w: c.w, h: c.h, onStep: () => c.onStep(), _collapseObj: c });
            }
            // spikes (triangles) placed as objects (x,y,size)
            const spikes = [
                { x: 360, y: height - 80, size: 80 },
                { x: 1320, y: height - 80, size: 120 },
                { x: 1560, y: height - 80, size: 70 },
            ];
            // hidden spikes (can pop up anywhere)
            const hiddenSpikes = [
                new HiddenSpike(960, height - 70, 44, true),
                new HiddenSpike(1880, height - 70, 56, true),
                new HiddenSpike(2300, height - 70, 44, true)
            ];
            // lava
            const lava = { x: 2200, y: height - 40, w: 800, h: 40 };

            // enemies
            const enemies = [
                new Enemy(540, height - 360, 80),
                new Enemy(1200, height - 500, 120),
                new Enemy(1620, height - 440, 200)
            ];

            // falling walls (troll)
            const fallingWalls = [
                new FallingWall(760, height - 600, 110, 40, true),
                new FallingWall(1640, height - 700, 140, 46, true),
                new FallingWall(1980, height - 700, 120, 48, true)
            ];

            const portal = new Portal(width - 160, height - 180);

            return {
                width, height, platforms, spikes, hiddenSpikes, lava, enemies, fallingWalls, collapsingPlatforms, portal
            };
        }

        // global level
        let level = buildLevel();
        let player = new Player(120, level.height - 180);

        // camera
        const cam = { x: 0, y: 0, w: W, h: H };
        function updateCam() {
            cam.x = player.x - canvas.width / 2;
            cam.y = Math.max(0, player.y - canvas.height / 2);
            cam.x = Math.max(0, Math.min(level.width - canvas.width, cam.x));
            cam.y = Math.max(0, Math.min(level.height - canvas.height, cam.y));
        }

        // overlay & UI
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        function overlayShow(title, text) {
            document.getElementById('overlayTitle').textContent = title;
            document.getElementById('overlayText').textContent = text;
            document.getElementById('overlay').style.display = 'block';
        }
        function overlayHide() { document.getElementById('overlay').style.display = 'none'; }

        // restart behavior
        function restart(fullReset = false) {
            if (fullReset) difficulty = 1, levelNum = 1;
            else { difficulty = Math.min(6, difficulty + 0.55); levelNum += 1; }
            level = buildLevel();
            player = new Player(120, level.height - 180);
            scoreEl.textContent = 'Score: 0';
            levelEl.textContent = 'Level: ' + levelNum;
            particles.length = 0;
            overlayHide();
            // restart audio
            if (!muted) { stopSynthLoop(); startSynthLoop(); }
        }

        // core update loop
        let last = performance.now();
        function loop(now) {
            const dt = Math.min(0.032, (now - last) / 1000);
            last = now;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        function update(dt) {
            if (!player.dead) {
                player.update(dt, level);
                // update collapsing platform objects too
                for (const p of level.platforms) {
                    if (p._collapseObj) p._collapseObj.update(dt, player);
                }
                // falling walls
                for (const fw of level.fallingWalls) fw.update(dt, player);
                // hidden spikes
                for (const hs of level.hiddenSpikes) hs.update(dt, player);
                // enemies
                for (const e of level.enemies) e.update(dt, player, level);
                // check triangular spikes instant-death
                for (const s of level.spikes) {
                    // build triangle pointing up with base at y+size
                    const aX = s.x + s.size / 2, aY = s.y;
                    const bX = s.x, bY = s.y + s.size;
                    const cX = s.x + s.size, cY = s.y + s.size;
                    // sample several points across player's bottom edge
                    const sampleX = [player.x + 2, player.x + player.w / 2, player.x + player.w - 2];
                    for (const sx of sampleX) {
                        const sy = player.y + player.h - 2;
                        if (pointInTri(sx, sy, aX, aY, bX, bY, cX, cY)) {
                            player.die('Touched spikes');
                        }
                    }
                }
                // lava check = instant death if overlaps
                if (rectsOverlap(player.bounds, level.lava)) {
                    player.die('Burned by lava');
                }
                // portal check
                if (level.portal.collides(player)) {
                    // win
                    player.score += 100;
                    sfxTone(980, 'triangle', 0.28, 0.12);
                    overlayShow('Level Complete', 'You escaped the devil level! Score: ' + player.score + ' — Restart to increase difficulty.');
                    // stop music to emphasize victory
                    stopSynthLoop();
                }
                // update collapsing objects that are separate set (they already get killed above)
                for (const c of level.collapsingPlatforms) c.update(dt, player);
            }
            updateParticles(dt);
            updateCam();
            scoreEl.textContent = 'Score: ' + player.score;
            levelEl.textContent = 'Level: ' + levelNum;
        }

        // rendering functions
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // background gradient
            const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
            g.addColorStop(0, '#060306'); g.addColorStop(1, '#0b0304');
            ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
            // parallax background subtle glow
            ctx.fillStyle = 'rgba(150,20,20,0.05)'; ctx.fillRect(-cam.x * 0.05, -cam.y * 0.02, canvas.width, canvas.height);

            // draw platforms
            for (const p of level.platforms) {
                drawPlatform(ctx, p, cam);
            }
            // draw collapsing platforms separately if they exist
            for (const c of level.collapsingPlatforms) c.draw(ctx, cam);

            // draw lava
            drawLava(ctx, level.lava, cam);

            // draw spikes (triangular)
            for (const s of level.spikes) drawTriSpike(ctx, s, cam);

            // draw hidden spikes
            for (const hs of level.hiddenSpikes) hs.draw(ctx, cam);

            // draw falling walls
            for (const fw of level.fallingWalls) fw.draw(ctx, cam);

            // draw enemies
            for (const e of level.enemies) e.draw(ctx, cam);

            // draw portal
            level.portal.draw(ctx, cam);

            // draw particles
            drawParticles(ctx);

            // draw player
            player.draw(ctx, cam);

            // subtle HUD note
            ctx.save();
            ctx.font = Math.max(12, canvas.width * 0.012) + 'px system-ui';
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillText('DEVIL LEVEL — TROLL DEMO', 12, canvas.height - 12);
            ctx.restore();
        }

        function drawPlatform(ctx, p, cam) {
            const x = p.x - cam.x, y = p.y - cam.y, w = p.w, h = p.h;
            ctx.fillStyle = '#222';
            ctx.fillRect(x, y, w, h);
            // top highlight
            const grad = ctx.createLinearGradient(x, y, x, y + h);
            grad.addColorStop(0, 'rgba(255,60,60,0.02)'); grad.addColorStop(0.5, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(x, y, w, h);
            // cracks
            ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
            for (let i = 0; i < w; i += 20) {
                ctx.beginPath(); ctx.moveTo(x + i, y + 2); ctx.lineTo(x + i + Math.sin((i + Date.now() / 60) / 30) * 6, y + h - 4); ctx.stroke();
            }
        }

        function drawTriSpike(ctx, s, cam) {
            const x = s.x - cam.x, y = s.y - cam.y, size = s.size;
            ctx.fillStyle = 'rgba(255,60,60,0.95)';
            ctx.beginPath();
            ctx.moveTo(x + size / 2, y);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x + size, y + size);
            ctx.closePath();
            ctx.fill();
            // shadow
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.fillRect(x, y + size, size, 4);
        }

        function drawLava(ctx, l, cam) {
            const x = l.x - cam.x, y = l.y - cam.y, w = l.w, h = l.h;
            const g = ctx.createLinearGradient(x, y, x, y + h);
            g.addColorStop(0, '#ff7a33'); g.addColorStop(1, '#8b0000');
            ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
            // animated ripples
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                const rx = x + (i * 97 + (Date.now() / 6)) % w;
                ctx.ellipse(rx, y + 6 * Math.sin(Date.now() / 400 + i), 54, 6 + 2 * Math.sin(Date.now() / 200 + i), 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,140,80,0.06)'; ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        // start/stop audio on first gesture
        function initAudioGesture() {
            function once() {
                ensureAudio();
                sfxTone(320, 'sine', 0.02, 0.02);
                if (!muted) startSynthLoop();
                window.removeEventListener('pointerdown', once);
            }
            window.addEventListener('pointerdown', once);
        }
        initAudioGesture();

        // UI bindings
        document.getElementById('restart').addEventListener('click', () => restart(false));
        document.getElementById('overlayRestart').addEventListener('click', () => { restart(false); });
        document.getElementById('overlayClose').addEventListener('click', () => { overlayHide(); });
        document.getElementById('mute').addEventListener('click', () => { muted = !muted; document.getElementById('mute').textContent = muted ? 'Unmute' : 'Mute'; if (muted) stopSynthLoop(); else startSynthLoop(); });

        // initialize
        startSynthLoop();

    </script>
</body>
