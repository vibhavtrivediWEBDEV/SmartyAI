<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil Troll Platformer</title>
<style>
  html, body {
    margin:0;
    padding:0;
    overflow:hidden;
    background:#050306;
    font-family:sans-serif;
    color:white;
  }
  canvas {
    display:block;
    background:#0c0405;
  }
  #hud {
    position:absolute;
    top:10px;
    left:10px;
    font-size:18px;
  }
</style>
</head>
<body>
<div id="hud">Deaths: 0 | Level: 1</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let deaths = 0;
let level = 1;

// Player
const player = {
  x: 100,
  y: 300,
  w: 40,
  h: 60,
  vx:0,
  vy:0,
  speed:6,
  jump:15,
  onGround:false,
  color:'#ff3b3b'
};

// Controls
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Levels
const levels = [
  // Level 1
  [
    {x:0,y:550,w:canvas.width,h:50,type:'ground'},
    {x:300,y:450,w:100,h:20,type:'platform'},
    {x:500,y:400,w:100,h:20,type:'break'}, // breakable
    {x:700,y:500,w:50,h:50,type:'spike'},
    {x:900,y:500,w:50,h:50,type:'lava'},
    {x:1050,y:500,w:50,h:50,type:'goal'}
  ],
  // Level 2 - Hard troll
  [
    {x:0,y:550,w:canvas.width,h:50,type:'ground'},
    {x:200,y:450,w:100,h:20,type:'break'},
    {x:400,y:400,w:100,h:20,type:'break'},
    {x:600,y:350,w:100,h:20,type:'platform'},
    {x:800,y:500,w:50,h:50,type:'spike'},
    {x:1000,y:500,w:50,h:50,type:'lava'},
    {x:1200,y:500,w:50,h:50,type:'goal'}
  ]
];

let currentLevel = JSON.parse(JSON.stringify(levels[0]));

// Physics
const gravity = 0.8;

function resetPlayer() {
  player.x = 100;
  player.y = 300;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
}

function nextLevel() {
  level++;
  if(level > levels.length) {
    alert('You beat the troll game! Total deaths: '+deaths);
    level = 1;
  }
  currentLevel = JSON.parse(JSON.stringify(levels[level-1]));
  resetPlayer();
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud').innerText = `Deaths: ${deaths} | Level: ${level}`;
}

function collide(a,b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

// Game Loop
function update() {
  // Horizontal
  if(keys['a'] || keys['arrowleft']) player.vx = -player.speed;
  else if(keys['d'] || keys['arrowright']) player.vx = player.speed;
  else player.vx = 0;

  // Jump
  if((keys['w'] || keys['arrowup'] || keys[' ']) && player.onGround){
    player.vy = -player.jump;
    player.onGround = false;
  }

  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;

  // Collisions
  currentLevel.forEach(obj=>{
    if(collide(player,obj)){
      if(obj.type==='ground' || obj.type==='platform' || obj.type==='break'){
        if(player.vy>0){
          player.y = obj.y - player.h;
          player.vy = 0;
          player.onGround = true;
          if(obj.type==='break'){
            obj.y = canvas.height+100; // fall down
          }
        }
      }
      if(obj.type==='spike' || obj.type==='lava'){
        deaths++;
        resetPlayer();
        updateHUD();
      }
      if(obj.type==='goal'){
        nextLevel();
      }
    }
  });

  // Boundaries
  if(player.y > canvas.height){
    deaths++;
    resetPlayer();
    updateHUD();
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Draw objects
  currentLevel.forEach(obj=>{
    if(obj.type==='ground') ctx.fillStyle='#222';
    else if(obj.type==='platform') ctx.fillStyle='#555';
    else if(obj.type==='break') ctx.fillStyle='#999';
    else if(obj.type==='spike') ctx.fillStyle='red';
    else if(obj.type==='lava') ctx.fillStyle='orange';
    else if(obj.type==='goal') ctx.fillStyle='lime';
    ctx.fillRect(obj.x,obj.y,obj.w,obj.h);
  });

  // Draw player
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x,player.y,player.w,player.h);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
loop();

window.addEventListener('resize',()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
