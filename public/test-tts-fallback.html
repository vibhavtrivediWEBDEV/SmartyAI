<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TTS Fallback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-area {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #0051D5;
        }
        .log {
            background: #1a1a1a;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .info { color: #74c0fc; }
        h1 { color: #333; }
        h2 { color: #666; }
    </style>
</head>
<body>
    <h1>🔊 Test TTS Fallback</h1>
    
    <div class="test-area">
        <h2>Test Scenarios</h2>
        <button onclick="testTTS('Hello, this is a test of the TTS system')">
            Test: Simple Message
        </button>
        <button onclick="testTTS('Automation complete. Notes app opened successfully.')">
            Test: Automation Message
        </button>
        <button onclick="testBrowserTTS()">
            Test: Browser TTS Only
        </button>
        <button onclick="clearLog()">
            Clear Log
        </button>
    </div>
    
    <div class="log" id="log">
        <div class="log-entry info">📝 Ready to test TTS...</div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '<div class="log-entry info">📝 Log cleared</div>';
        }

        async function testTTS(text) {
            log(`🎤 Testing TTS with: "${text}"`, 'info');
            
            try {
                log('📡 Calling ElevenLabs API...', 'info');
                const response = await fetch('/api/elevenlabs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    log(`❌ ElevenLabs API error: ${errorData.error || response.status}`, 'error');
                    log('🔊 Falling back to browser TTS...', 'info');
                    
                    // Fallback to Web Speech API
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'en-US';
                        utterance.rate = 0.85;
                        
                        utterance.onstart = () => log('🔊 Browser TTS started', 'success');
                        utterance.onend = () => log('✅ Browser TTS complete', 'success');
                        utterance.onerror = (e) => log(`⚠️ Browser TTS error: ${e.error}`, 'error');
                        
                        window.speechSynthesis.speak(utterance);
                    } else {
                        log('❌ Web Speech API not supported', 'error');
                    }
                } else {
                    log('✅ ElevenLabs API success', 'success');
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    
                    audio.onplay = () => log('🔊 Playing ElevenLabs audio', 'success');
                    audio.onended = () => {
                        log('✅ Audio playback complete', 'success');
                        URL.revokeObjectURL(audioUrl);
                    };
                    audio.onerror = (e) => log(`❌ Audio error: ${e}`, 'error');
                    
                    await audio.play();
                }
            } catch (err) {
                log(`❌ Error: ${err.message}`, 'error');
                log('🔊 Attempting browser TTS fallback...', 'info');
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85;
                    
                    utterance.onstart = () => log('🔊 Browser TTS started (fallback)', 'success');
                    utterance.onend = () => log('✅ Browser TTS complete (fallback)', 'success');
                    utterance.onerror = (e) => log(`⚠️ Browser TTS error: ${e.error}`, 'error');
                    
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        function testBrowserTTS() {
            const text = 'Testing browser text to speech directly';
            log('🔊 Testing browser TTS directly (no API)', 'info');
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                
                utterance.onstart = () => log('🔊 Browser TTS started', 'success');
                utterance.onend = () => log('✅ Browser TTS complete', 'success');
                utterance.onerror = (e) => log(`⚠️ Browser TTS error: ${e.error}`, 'error');
                
                // Log available voices
                const voices = window.speechSynthesis.getVoices();
                log(`🎵 Available voices: ${voices.length}`, 'info');
                if (voices.length > 0) {
                    const preferred = voices.find(v => 
                        v.name.includes('Google') || 
                        v.name.includes('Samantha')
                    );
                    if (preferred) {
                        utterance.voice = preferred;
                        log(`🎤 Using voice: ${preferred.name}`, 'info');
                    }
                }
                
                window.speechSynthesis.speak(utterance);
            } else {
                log('❌ Web Speech API not supported', 'error');
            }
        }

        // Log voices when loaded
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                const voices = window.speechSynthesis.getVoices();
                log(`🎵 Voices loaded: ${voices.length}`, 'info');
            };
        }
    </script>
</body>
</html>
